# Production for this demo is a GitHub Pages site built from the trunk. Each
# run records a deployment of the merged commit to `github-pages`, which is
# what flow reads (`deploys.source: forge_deployments`) to check that every
# merge shipped within `deploys.max_lag`.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir -p _site && cp README.md _site/index.md
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./_site, destination: ./_site/out }
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./_site/out }
      - id: deployment
        uses: actions/deploy-pages@v4
