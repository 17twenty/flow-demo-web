# Ships the trunk to GitHub Pages. The job names the github-pages
# environment, so GitHub records a deployment against the commit it shipped:
# that record is what flow reads to know a merge reached production.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          mkdir -p _site
          {
            echo '<!doctype html><meta charset="utf-8"><title>flow-demo-web</title>'
            echo '<pre>'
            sed 's/&/\&amp;/g; s/</\&lt;/g' README.md
            echo "</pre><p>Shipped from ${GITHUB_SHA::7}.</p>"
          } > _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
